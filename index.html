<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>信用卡權益決策站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Noto+Serif+TC:wght@400;700&family=LXGW+WenKai+TC:wght@400;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: {
    colors: {
      paper:'#F3ECDC', card:'#FBF7EC', kraft:'#B98F63',
      ink:'#3B2F25', ink2:'#66564A', ink3:'#8F7E6B',
      line:'#DCCFB8', line2:'#E9E0CD',
      seal:'#B3301F', sealdim:'#F1DDD2',
      pen:'#2B4A86', pendim:'#E0E2E8',
      leaf:'#2F6B4F', plum:'#6E3B6E',
      hi:'#F2DC5D', hidark:'#4A3A00',
      tape1:'#E0B24A', tape2:'#DB9A95', tape3:'#9DB592'
    },
    fontFamily: {
      disp:['"Young Serif"','"Noto Serif TC"','serif'],
      kai:['"LXGW WenKai TC"','"Noto Serif TC"','serif'],
      type:['"Courier Prime"','monospace']
    }
  } }
}
</script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>
  body{
    background-color:#F3ECDC;
    background-image:radial-gradient(rgba(59,47,37,.13) 1px, transparent 1.3px);
    background-size:22px 22px;
    -webkit-tap-highlight-color:transparent;
  }
  .jcard{
    position:relative;background:#FBF7EC;border:1px solid #DCCFB8;border-radius:3px;
    box-shadow:0 1px 0 #DCCFB8;
  }
  .jcard::before{
    content:"";position:absolute;top:-12px;left:50%;width:108px;height:24px;
    transform:translateX(-50%) rotate(-4deg);opacity:.7;background:var(--tape,#E0B24A);
    clip-path:polygon(1% 12%, 4% 2%, 96% 0, 99% 10%, 100% 88%, 97% 100%, 3% 98%, 0 90%);
    pointer-events:none;
  }
  .tape-a{--tape:#E0B24A}.tape-b{--tape:#DB9A95}.tape-c{--tape:#9DB592}.tape-d{--tape:#B98F63}
  .stamp{
    display:inline-block;border:2px double #B3301F;color:#B3301F;border-radius:3px;
    transform:rotate(-3deg);padding:0 .45em;font-size:11px;line-height:1.7;white-space:nowrap;
  }
  .chip{border:1px solid #DCCFB8;background:#FBF7EC;color:#3B2F25;}
  .chip-on{background:#B3301F !important;color:#FBF7EC !important;border-color:#B3301F !important;}
  .btn-seal{background:#B3301F;color:#FBF7EC;border-radius:3px;}
  .btn-seal:active{transform:translateY(1px);}
  .btn-kraft{background:#B98F63;color:#FBF7EC;border-radius:3px;}
  .field{background:#fffdf6;border:1px solid #DCCFB8;border-radius:3px;color:#3B2F25;}
  .field:focus{outline:2px solid #B98F63;outline-offset:0;}
  [x-cloak]{display:none !important;}
</style>
</head>
<body class="text-ink font-kai min-h-screen" x-data="app()" x-init="init()" x-cloak>

<!-- 頂欄 -->
<header class="bg-seal text-[#FBF7EC] sticky top-0 z-20" style="box-shadow:0 2px 0 rgba(59,47,37,.25)">
  <div class="max-w-2xl mx-auto px-4 pt-3 pb-1 flex items-center justify-between gap-2">
    <div>
      <h1 class="font-disp text-xl leading-tight">💳 信用卡權益決策站</h1>
      <p class="font-type text-xs opacity-80" x-text="benefits ? 'updated ' + benefits.last_checked.replace('T',' ').slice(0,16) : 'loading…'"></p>
    </div>
    <div class="flex gap-2 text-sm font-kai">
      <button @click="refresh()" class="bg-[#FBF7EC]/15 hover:bg-[#FBF7EC]/25 rounded px-3 py-2">↻ 重新整理</button>
      <button @click="showSettings = true" class="bg-[#FBF7EC]/15 hover:bg-[#FBF7EC]/25 rounded px-3 py-2">⚙️ 連線</button>
    </div>
  </div>
  <nav class="max-w-2xl mx-auto px-4 flex gap-5 text-[15px]">
    <button @click="tab='calc'" class="pb-2 border-b-[3px]"
      :class="tab==='calc' ? 'border-tape1 font-bold' : 'border-transparent opacity-70'">試算</button>
    <button @click="tab='ledger'" class="pb-2 border-b-[3px]"
      :class="tab==='ledger' ? 'border-tape2 font-bold' : 'border-transparent opacity-70'">額度記帳</button>
    <button @click="tab='cards'" class="pb-2 border-b-[3px]"
      :class="tab==='cards' ? 'border-tape3 font-bold' : 'border-transparent opacity-70'">卡片管理</button>
  </nav>
</header>

<main class="max-w-2xl mx-auto px-4 py-5 pb-24">

  <!-- 變動紀錄 -->
  <div class="mb-4" x-show="benefits">
    <button @click="showChangelog = !showChangelog" class="text-sm text-pen underline underline-offset-2">📋 權益變動紀錄（<span x-text="benefits.changelog.length"></span>）</button>
    <ul x-show="showChangelog" class="mt-2 text-sm jcard tape-d p-3 space-y-1">
      <template x-for="c in benefits.changelog" :key="c"><li class="border-b border-dashed border-line pb-1" x-text="c"></li></template>
    </ul>
  </div>

  <!-- ============ 試算 ============ -->
  <section x-show="tab==='calc'" class="space-y-5">
    <div class="jcard tape-a p-4">
      <h2 class="font-disp font-bold mb-2">1. 選擇消費情境</h2>
      <div class="flex flex-wrap gap-2">
        <template x-for="s in SCENARIOS" :key="s">
          <button @click="scenario = s" :class="scenario===s ? 'chip-on' : ''"
            class="chip text-sm rounded-full px-3 py-1.5" x-text="s"></button>
        </template>
      </div>
    </div>

    <div class="jcard tape-b p-4 space-y-3">
      <h2 class="font-disp font-bold">2. 輸入金額</h2>
      <div class="flex gap-2">
        <input x-model.number="amount" type="number" min="0" inputmode="numeric" placeholder="例如 12000"
          class="field flex-1 min-w-0 font-type text-xl px-4 py-3">
        <button @click="calculate()" class="btn-seal font-bold px-6 text-lg shrink-0">試算</button>
      </div>
      <label class="flex items-center gap-2 text-sm text-ink2">
        <input type="checkbox" x-model="deductFee" class="w-4 h-4 accent-[#B3301F]">
        海外消費扣除 1.5% 手續費後再比較
      </label>
    </div>

    <div x-show="results.length" class="space-y-5">
      <h2 class="font-disp font-bold text-lg">推薦順序 <span class="text-sm font-kai text-ink3">（依預估實拿排序）</span></h2>
      <template x-for="(r, i) in results" :key="r.pool.pool_id">
        <div class="jcard p-4" :class="['tape-a','tape-b','tape-c','tape-d'][i % 4]">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <div class="text-xs text-ink3">
                <span class="stamp" x-show="i===0">推</span>
                <span x-text="'第 ' + (i+1) + ' 順位・' + r.pool.card_name"></span>
              </div>
              <div class="font-bold mt-1" x-text="r.pool.pool_name"></div>
              <div class="text-xs text-ink3 mt-1" x-text="r.pool.notes"></div>
            </div>
            <div class="text-right shrink-0">
              <div class="font-type text-2xl font-bold text-seal" x-text="'NT$' + Math.round(r.net).toLocaleString()"></div>
              <div class="font-type text-xs text-ink3" x-text="'net ' + (r.netRate*100).toFixed(2) + '%'"></div>
            </div>
          </div>
          <div class="mt-2 text-sm flex flex-wrap gap-x-4 gap-y-1 text-ink2">
            <span>回饋率 <b class="font-type" x-text="(r.pool.total_rate*100).toFixed(1) + '%'"></b></span>
            <span x-show="r.pool.cap_spend">剩餘高回饋額度 <b class="font-type text-seal" x-text="'NT$' + Math.round(r.remaining).toLocaleString()"></b></span>
            <span x-show="!r.pool.cap_spend" class="text-ink3">無上限</span>
            <span x-show="r.pool.requires_registration" class="text-seal">⚠️ 需先登錄</span>
            <span x-show="r.pool.requires_switch" class="text-seal">⚠️ 需切換方案</span>
          </div>
          <div x-show="r.splitTip" class="mt-2 text-sm rounded p-2" style="background:#F2DC5D33;border:1px dashed #B98F63" x-text="r.splitTip"></div>
          <button @click="quickLog(r.pool.pool_id, Math.min(amount, r.remaining === Infinity ? amount : r.remaining))"
            class="btn-kraft mt-2 text-sm px-3 py-1.5">＋ 記帳此筆</button>
        </div>
      </template>
    </div>
  </section>

  <!-- ============ 額度記帳 ============ -->
  <section x-show="tab==='ledger'" class="space-y-5" x-cloak>
    <div class="jcard tape-b p-4 flex items-center justify-between gap-2">
      <div>
        <h2 class="font-disp font-bold">當月記帳</h2>
        <p class="text-sm text-ink2">記帳月份：<span class="font-type" x-text="state ? state.monthly_ledger.current_month : ''"></span></p>
      </div>
      <div class="flex gap-2 items-center">
        <input type="month" x-model="resetMonth" class="field text-sm px-2 py-1.5">
        <button @click="resetMonth_()" class="btn-kraft text-sm px-3 py-1.5">歸零</button>
      </div>
    </div>

    <template x-for="p in cappedPools()" :key="p.pool_id">
      <div class="jcard tape-c p-4">
        <div class="flex justify-between items-baseline gap-2">
          <div class="min-w-0">
            <div class="font-bold text-sm" x-text="p.card_name"></div>
            <div class="text-sm text-ink2" x-text="p.pool_name"></div>
          </div>
          <div class="text-right text-sm shrink-0 font-type">
            <span class="font-bold text-seal" x-text="'NT$' + Math.round(spentOf(p.pool_id)).toLocaleString()"></span>
            <span class="text-ink3" x-text="' / ' + p.cap_spend.toLocaleString()"></span>
          </div>
        </div>
        <div class="mt-2 h-3 rounded-full overflow-hidden" style="background:#E9E0CD">
          <div class="h-full rounded-full" :style="'width:' + Math.min(100, pctOf(p)) + '%;background:' + (pctOf(p) >= 100 ? '#B3301F' : (pctOf(p) >= 80 ? '#E0B24A' : '#2B4A86'))"></div>
        </div>
        <div class="mt-1 text-xs text-ink2 flex justify-between">
          <span x-text="pctOf(p) >= 100 ? '⚠️ 已刷滿，超出部分只拿基本回饋' : '剩餘 NT$' + Math.round(p.cap_spend - spentOf(p.pool_id)).toLocaleString()"></span>
          <button @click="resetPool(p.pool_id)" class="underline underline-offset-2 text-pen">此池歸零</button>
        </div>
        <div class="mt-2 flex gap-2">
          <input x-model.number="ledgerInputs[p.pool_id]" type="number" min="0" inputmode="numeric" placeholder="金額"
            class="field flex-1 min-w-0 px-3 py-2 font-type">
          <input x-model="ledgerMerchants[p.pool_id]" type="text" placeholder="店家（選填）"
            class="field flex-1 min-w-0 px-3 py-2 text-sm">
          <button @click="logSpend(p.pool_id)" class="btn-seal px-4 py-2 text-sm font-bold shrink-0">記帳</button>
        </div>
      </div>
    </template>

    <div class="jcard tape-d p-4">
      <h2 class="font-disp font-bold mb-2">交易明細</h2>
      <p x-show="!state || !state.monthly_ledger.transactions.length" class="text-sm text-ink3">本月還沒有記帳</p>
      <ul class="divide-y divide-dashed divide-line text-sm">
        <template x-for="t in (state ? state.monthly_ledger.transactions : [])" :key="t.id">
          <li class="py-2 flex justify-between items-center gap-2">
            <div class="min-w-0">
              <span class="font-type text-ink3" x-text="t.date"></span>
              <span class="font-bold" x-text="poolName(t.pool_id)"></span>
              <span class="text-ink3" x-show="t.merchant" x-text="'・' + t.merchant"></span>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              <span class="font-type font-bold" x-text="'NT$' + t.amount.toLocaleString()"></span>
              <button @click="delTx(t.id)" class="text-seal text-xs underline underline-offset-2">刪除</button>
            </div>
          </li>
        </template>
      </ul>
    </div>
  </section>

  <!-- ============ 卡片管理 ============ -->
  <section x-show="tab==='cards'" class="space-y-5" x-cloak>
    <div class="jcard tape-c p-4">
      <h2 class="font-disp font-bold mb-2">我的卡片</h2>
      <ul class="divide-y divide-dashed divide-line">
        <template x-for="c in (state ? state.active_cards : [])" :key="c.card_id">
          <li class="py-2 flex items-center justify-between gap-2">
            <div class="text-sm min-w-0">
              <div class="font-bold" x-text="c.bank + '・' + c.name"></div>
              <div class="font-type text-xs text-ink3" x-text="'結帳日 ' + c.statement_day + ' 號'"></div>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              <button @click="c.enabled = !c.enabled; saveState()"
                :style="'background:' + (c.enabled ? '#2F6B4F' : '#DCCFB8')"
                class="relative w-11 h-6 rounded-full transition">
                <span class="absolute top-0.5 w-5 h-5 bg-[#FBF7EC] rounded-full shadow transition-all"
                  :class="c.enabled ? 'left-[22px]' : 'left-0.5'"></span>
              </button>
              <button @click="delCard(c.card_id)" class="text-seal text-xs underline underline-offset-2">刪除</button>
            </div>
          </li>
        </template>
      </ul>
      <div class="mt-3 pt-3 border-t border-dashed border-line space-y-2">
        <h3 class="font-bold text-sm">新增卡片</h3>
        <div class="flex gap-2">
          <input x-model="newCard.bank" placeholder="銀行" class="field flex-1 min-w-0 px-3 py-2 text-sm">
          <input x-model="newCard.name" placeholder="卡名" class="field flex-1 min-w-0 px-3 py-2 text-sm">
          <input x-model.number="newCard.statement_day" type="number" placeholder="結帳日" class="field w-20 px-3 py-2 text-sm font-type">
        </div>
        <button @click="addCard()" class="btn-seal text-sm px-4 py-2 font-bold">＋ 新增</button>
        <p class="text-xs text-ink3">新增卡片後，隔天 09:00 排程會自動把它納入權益巡檢並補上加碼池。</p>
      </div>
    </div>

    <div class="jcard tape-a p-4 space-y-3">
      <h2 class="font-disp font-bold">銀行帳戶等級</h2>
      <template x-for="(v, k) in tiersDraft" :key="k">
        <div>
          <label class="text-sm font-bold" x-text="k"></label>
          <textarea x-model="tiersDraft[k]" rows="2" class="field w-full text-sm px-3 py-2 mt-1"></textarea>
        </div>
      </template>
      <button @click="saveTiers()" class="btn-seal text-sm px-4 py-2 font-bold">儲存等級</button>
      <p class="text-xs text-ink3">例如星展存滿 30 萬，直接改這裡，隔天排程會自動解鎖對應權益。</p>
    </div>
  </section>

</main>

<!-- 設定視窗 -->
<div x-show="showSettings" class="fixed inset-0 z-30 flex items-end sm:items-center justify-center" x-cloak>
  <div class="absolute inset-0 bg-[#3B2F25]/50" @click="showSettings = false"></div>
  <div class="jcard tape-b relative w-full sm:max-w-md p-5 space-y-3" style="border-radius:6px">
    <h2 class="font-disp font-bold text-lg">⚙️ GitHub 連線設定</h2>
    <p class="text-xs text-ink2">輸入一次即可，token 只存在這台裝置的瀏覽器裡，不會上傳到任何地方。需要 Contents 讀寫權限的 fine-grained token。</p>
    <label class="block text-sm">Owner
      <input x-model="settings.owner" class="field mt-1 w-full px-3 py-2">
    </label>
    <label class="block text-sm">Repo
      <input x-model="settings.repo" class="mt-1 w-full field px-3 py-2">
    </label>
    <label class="block text-sm">Personal Access Token
      <input x-model="settings.token" type="password" class="field mt-1 w-full px-3 py-2 font-type" placeholder="github_pat_...">
    </label>
    <div class="flex gap-2">
      <button @click="saveSettings()" class="btn-seal flex-1 px-4 py-2 font-bold">儲存</button>
      <button @click="testConn()" class="btn-kraft flex-1 px-4 py-2">測試連線</button>
      <button @click="showSettings = false" class="px-4 py-2 text-ink3">關閉</button>
    </div>
  </div>
</div>

<!-- 提示 -->
<div x-show="toastMsg" x-transition class="fixed bottom-6 left-1/2 -translate-x-1/2 z-40 text-sm px-4 py-2.5 max-w-[90%] jcard tape-a font-kai" x-text="toastMsg" x-cloak></div>

<script>
const SCENARIOS = ['新加坡實體','日本實體','韓國實體','歐美實體','國內一般','國外一般','國內網購','餐廳聚餐','旅遊訂房','行動支付'];
const OVERSEAS = ['新加坡實體','日本實體','韓國實體','歐美實體','國外一般'];

function toB64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}

function app() {
  return {
    tab: 'calc', state: null, benefits: null,
    scenario: '新加坡實體', amount: '', deductFee: true, results: [],
    ledgerInputs: {}, ledgerMerchants: {}, resetMonth: '',
    newCard: { bank: '', name: '', statement_day: '' },
    tiersDraft: {}, showSettings: false, showChangelog: false,
    settings: { owner: 'waltwait', repo: 'credit-card-hub', token: '' },
    toastMsg: '', toastTimer: null,

    async init() {
      const saved = localStorage.getItem('cc_hub_settings');
      if (saved) this.settings = JSON.parse(saved);
      await this.loadData();
      this.resetMonth = this.state ? this.state.monthly_ledger.current_month : '';
      if (this.state) this.tiersDraft = JSON.parse(JSON.stringify(this.state.profile.bank_tiers));
    },

    toast(msg) {
      this.toastMsg = msg;
      clearTimeout(this.toastTimer);
      this.toastTimer = setTimeout(() => this.toastMsg = '', 2800);
    },

    async loadData() {
      try {
        const t = Date.now();
        const [s, b] = await Promise.all([
          fetch('./data/user_state.json?t=' + t).then(r => r.json()),
          fetch('./data/benefits_db.json?t=' + t).then(r => r.json())
        ]);
        const draft = localStorage.getItem('cc_hub_state_draft');
        if (draft) {
          const d = JSON.parse(draft);
          if (d.last_modified > s.last_modified) {
            this.state = d;
            this.toast('載入了本機未同步的變更，記得按連線設定同步');
          } else this.state = s;
        } else this.state = s;
        this.benefits = b;
        this.tiersDraft = JSON.parse(JSON.stringify(this.state.profile.bank_tiers));
      } catch (e) {
        this.toast('讀取資料失敗：' + e.message);
      }
    },

    refresh() { this.loadData().then(() => this.toast('已重新讀取最新資料')); },

    enabledCardIds() {
      return new Set((this.state?.active_cards || []).filter(c => c.enabled).map(c => c.card_id));
    },

    calculate() {
      const amt = Number(this.amount);
      if (!amt || amt <= 0) { this.toast('請輸入金額'); return; }
      const enabled = this.enabledCardIds();
      const spent = this.state.monthly_ledger.pool_spent || {};
      const overseas = OVERSEAS.includes(this.scenario);
      const out = [];
      for (const p of this.benefits.pools) {
        if (!enabled.has(p.card_id)) continue;
        if (!p.scenarios.includes(this.scenario)) continue;
        const s = spent[p.pool_id] || 0;
        const remaining = p.cap_spend ? Math.max(0, p.cap_spend - s) : Infinity;
        const eligible = Math.min(amt, remaining);
        const overflow = Math.max(0, amt - eligible);
        const reward = eligible * p.total_rate + overflow * p.base_rate;
        const fee = (this.deductFee && overseas && p.foreign_tx_fee) ? amt * p.foreign_tx_fee : 0;
        const net = reward - fee;
        out.push({ pool: p, remaining, net, netRate: amt ? net / amt : 0, splitTip: '' });
      }
      out.sort((a, b) => b.net - a.net);
      if (out.length >= 2 && out[0].remaining !== Infinity && amt > out[0].remaining && out[0].remaining > 0) {
        const r0 = out[0], r1 = out[1];
        r0.splitTip = '⚠️ 這筆會刷爆上限！建議先刷第 1 順位 NT$' + Math.round(r0.remaining).toLocaleString() +
          '，剩餘 NT$' + Math.round(amt - r0.remaining).toLocaleString() +
          ' 改刷第 2 順位「' + r1.pool.card_name + '・' + r1.pool.pool_name + '」。';
      }
      this.results = out;
      if (!out.length) this.toast('這個情境目前沒有適用的卡片');
    },

    spentOf(pid) { return (this.state?.monthly_ledger.pool_spent || {})[pid] || 0; },
    pctOf(p) { return p.cap_spend ? (this.spentOf(p.pool_id) / p.cap_spend) * 100 : 0; },
    cappedPools() {
      if (!this.benefits) return [];
      const enabled = this.enabledCardIds();
      return this.benefits.pools.filter(p => p.cap_spend && enabled.has(p.card_id));
    },
    poolName(pid) {
      const p = (this.benefits?.pools || []).find(x => x.pool_id === pid);
      return p ? p.card_name + '・' + p.pool_name : pid;
    },

    async logSpend(pid) {
      const amt = Number(this.ledgerInputs[pid]);
      if (!amt || amt <= 0) { this.toast('請輸入金額'); return; }
      const merchant = (this.ledgerMerchants[pid] || '').trim();
      const L = this.state.monthly_ledger;
      L.pool_spent[pid] = (L.pool_spent[pid] || 0) + amt;
      L.transactions.unshift({
        id: 'tx_' + Date.now(),
        date: new Date().toISOString().slice(0, 10),
        pool_id: pid, merchant, amount: amt
      });
      this.ledgerInputs[pid] = ''; this.ledgerMerchants[pid] = '';
      await this.saveState();
    },

    async quickLog(pid, amt) {
      if (!amt || amt <= 0) { this.toast('金額為 0，不用記帳'); return; }
      const L = this.state.monthly_ledger;
      L.pool_spent[pid] = (L.pool_spent[pid] || 0) + amt;
      L.transactions.unshift({ id: 'tx_' + Date.now(), date: new Date().toISOString().slice(0, 10), pool_id: pid, merchant: '', amount: Math.round(amt) });
      await this.saveState();
    },

    async delTx(id) {
      const L = this.state.monthly_ledger;
      const t = L.transactions.find(x => x.id === id);
      if (t) L.pool_spent[t.pool_id] = Math.max(0, (L.pool_spent[t.pool_id] || 0) - t.amount);
      L.transactions = L.transactions.filter(x => x.id !== id);
      await this.saveState();
    },

    async resetPool(pid) {
      this.state.monthly_ledger.pool_spent[pid] = 0;
      await this.saveState();
    },

    async resetMonth_() {
      if (!this.resetMonth) { this.toast('請先選月份'); return; }
      const L = this.state.monthly_ledger;
      L.current_month = this.resetMonth;
      Object.keys(L.pool_spent).forEach(k => L.pool_spent[k] = 0);
      L.transactions = [];
      await this.saveState();
      this.toast('已歸零，月份設為 ' + this.resetMonth);
    },

    addCard() {
      const { bank, name, statement_day } = this.newCard;
      if (!bank.trim() || !name.trim()) { this.toast('請填銀行和卡名'); return; }
      const id = 'CARD_' + Date.now().toString(36).toUpperCase();
      this.state.active_cards.push({ card_id: id, bank: bank.trim(), name: name.trim(), enabled: true, statement_day: Number(statement_day) || 1 });
      this.newCard = { bank: '', name: '', statement_day: '' };
      this.saveState();
    },

    async delCard(id) {
      if (!confirm('確定刪除這張卡？')) return;
      this.state.active_cards = this.state.active_cards.filter(c => c.card_id !== id);
      await this.saveState();
    },

    async saveTiers() {
      this.state.profile.bank_tiers = JSON.parse(JSON.stringify(this.tiersDraft));
      await this.saveState();
    },

    async saveState() {
      this.state.last_modified = new Date().toISOString();
      localStorage.setItem('cc_hub_state_draft', JSON.stringify(this.state));
      if (!this.settings.token) {
        this.toast('已暫存本機，設定 GitHub 連線後會自動同步');
        return;
      }
      try {
        await this.ghPut('data/user_state.json', this.state);
        localStorage.removeItem('cc_hub_state_draft');
        this.toast('已同步到 GitHub ✓');
      } catch (e) {
        this.toast('同步失敗，已暫存本機：' + e.message);
      }
    },

    async ghPut(path, obj) {
      const s = this.settings;
      const url = 'https://api.github.com/repos/' + s.owner + '/' + s.repo + '/contents/' + path;
      const headers = { 'Authorization': 'Bearer ' + s.token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' };
      let sha = null;
      const get = await fetch(url, { headers });
      if (get.ok) sha = (await get.json()).sha;
      const body = { message: 'chore: 更新 user_state.json（網頁）', content: toB64(JSON.stringify(obj, null, 2)) };
      if (sha) body.sha = sha;
      const put = await fetch(url, { method: 'PUT', headers, body: JSON.stringify(body) });
      if (!put.ok) {
        const t = await put.text();
        throw new Error(put.status + ' ' + t.slice(0, 120));
      }
    },

    saveSettings() {
      localStorage.setItem('cc_hub_settings', JSON.stringify(this.settings));
      this.showSettings = false;
      this.toast('連線設定已儲存');
    },

    async testConn() {
      const s = this.settings;
      if (!s.token) { this.toast('請先填 token'); return; }
      try {
        const r = await fetch('https://api.github.com/repos/' + s.owner + '/' + s.repo,
          { headers: { 'Authorization': 'Bearer ' + s.token, 'Accept': 'application/vnd.github+json' } });
        this.toast(r.ok ? '連線成功 ✓' : '連線失敗：' + r.status);
      } catch (e) { this.toast('連線失敗：' + e.message); }
    }
  };
}
</script>
